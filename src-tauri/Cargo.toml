[package]
name = "bluepeak_vinyl_player"
version = "1.0.0"
description = "BluePeak Vinyl Player desktop application"
authors = ["BluePeak"]
edition = "2021"

[lib]
name = "bluepeak_vinyl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
